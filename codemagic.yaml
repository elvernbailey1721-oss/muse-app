# Codemagic — PaintScope iOS unsigned build (no Mac, no paid Apple account needed)
#
# Why this file exists: an iPhone app must be compiled on a Mac. Codemagic's
# free tier gives you 500 macOS M2 build minutes/month (no credit card), which
# is ~25-40 PaintScope builds. This produces an UNSIGNED .ipa that you then
# install on your iPhone from your Chromebook with a FREE Apple ID
# (see docs/IPHONE_INSTALL.md). Free signing expires every 7 days -> re-sign
# weekly. No push notifications / iCloud on the free path.
#
# PROJECT FACTS (verified against the repo — do not "fix" these blindly):
#   - iOS project is App.xcodeproj (NOT a .xcworkspace, NO CocoaPods).
#   - Swift dependencies come from the local CapApp-SPM package
#     (app/ios/App/CapApp-SPM), which references the Capacitor plugins in
#     app/node_modules, plus one remote package (capacitor-swift-pm).
#   - There are no shared .xcschemes, so the build uses -target App
#     (targets need no scheme). Do not switch to -scheme without adding one.
#
#   - iOS image assets (*.png in Assets.xcassets) are stored in the repo as
#     base64 text (app/ios/image-assets/*.png.b64) because GitHub's API file
#     push cannot carry binary files. The 147KB app icon is split into
#     100KB chunks (appicon.00.b64, appicon.01.b64) to fit the API's
#     argument size limit; CI concatenates them before decoding.
#     The 3 splash PNGs were byte-identical, so one .b64 restores all three.
#
# SETUP (one time, ~10 minutes):
#   1. Push this whole paintscope-mobile folder to a GitHub repo (private is fine).
#   2. Create a free Codemagic account at https://codemagic.com/signup (no card).
#   3. Add application -> connect your GitHub repo -> Codemagic finds this file.
#   4. To conserve free minutes, builds run ONLY when you push a git tag like
#      `ios-v1` (not on every commit):  git tag ios-v1 && git push origin ios-v1
#   5. When the build finishes, download the .ipa from the build's Artifacts tab
#      onto your Chromebook's Linux files.
#
# When you later pay for the $99/yr Apple Developer Program (for TestFlight,
# push, App Store), switch this workflow to Codemagic's signed Xcode build
# with your Apple credentials — no app-code changes needed.

workflows:
  ios-unsigned:
    name: PaintScope iOS (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_TARGET: "App"
      xcode: latest
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "ios-*"
          include: true
    scripts:
      - name: Install app dependencies
        script: |
          set -e
          cd app
          npm ci
      - name: Restore prebuilt web assets and sync to iOS
        script: |
          set -e
          cd app
          # www/ (index.html + 24MB media) is committed as a single binary
          # tarball (GitHub's file API can't carry binary, so Elvern uploads
          # www.tar.gz via the github.com web UI). Fail loudly if missing.
          if [ ! -f www.tar.gz ]; then
            echo "ERROR: app/www.tar.gz missing — upload it via github.com (Add file > Upload files in app/)" >&2
            exit 1
          fi
          tar -xzf www.tar.gz
          npm run build:web
          npx cap sync ios
      - name: Inject transitive SwiftPM deps into CapApp-SPM
        script: |
          set -e
          cd app
          # npx cap sync regenerates ios/App/CapApp-SPM/Package.swift, and
          # xcodebuild does not fetch TRANSITIVE remote deps of the local
          # path-based plugin packages (build failed with "unable to resolve
          # module dependency: 'KeychainSwift'"). Promote them to direct
          # dependencies of CapApp-SPM so they are always resolved.
          python3 - <<'PYEOF'
          path = "ios/App/CapApp-SPM/Package.swift"
          with open(path) as f:
              c = f.read()
          if "keychain-swift.git" not in c:
              old = '.package(url: "https://github.com/ionic-team/capacitor-swift-pm.git", exact: "8.5.2"),'
              new = (old +
                     '\n        .package(url: "https://github.com/evgenyneu/keychain-swift.git", from: "21.0.0"),' +
                     '\n        .package(url: "https://github.com/ionic-team/ion-ios-camera.git", .upToNextMinor(from: "2.0.0")),')
              assert old in c, "capacitor-swift-pm pin not found in Package.swift"
              c = c.replace(old, new)
              oldp = '.product(name: "Cordova", package: "capacitor-swift-pm"),'
              newp = (oldp +
                      '\n                .product(name: "KeychainSwift", package: "keychain-swift"),' +
                      '\n                .product(name: "IONCameraLib", package: "ion-ios-camera"),')
              assert oldp in c, "Cordova product not found in Package.swift"
              c = c.replace(oldp, newp)
              with open(path, "w") as f:
                  f.write(c)
              print("Injected keychain-swift + ion-ios-camera into CapApp-SPM")
          else:
              print("Transitive deps already present, skipping")
          PYEOF
      - name: Restore iOS image assets from embedded base64
        script: |
          set -e
          cd app
          ASSETS="ios/App/App/Assets.xcassets"
          base64 -d -i ios/image-assets/splash.png.b64 -o "$ASSETS/Splash.imageset/splash-2732x2732.png"
          cp "$ASSETS/Splash.imageset/splash-2732x2732.png" "$ASSETS/Splash.imageset/splash-2732x2732-1.png"
          cp "$ASSETS/Splash.imageset/splash-2732x2732.png" "$ASSETS/Splash.imageset/splash-2732x2732-2.png"
          cat ios/image-assets/appicon.0*.b64 | base64 -d -o "$ASSETS/AppIcon.appiconset/AppIcon-512@2x.png"
          ls -la "$ASSETS/Splash.imageset/" "$ASSETS/AppIcon.appiconset/"
      - name: Resolve Swift package dependencies
        script: |
          set -e
          cd app
          xcodebuild \
            -resolvePackageDependencies \
            -project "$XCODE_PROJECT"
      - name: Build unsigned .app (no code signing)
        script: |
          set -e
          cd app
          echo "=== working directory ==="
          pwd
          ls
          echo "=== xcodebuild version ==="
          xcodebuild -version
          echo "=== project targets and schemes ==="
          xcodebuild -list -project "$XCODE_PROJECT"
          set +e
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -target "$XCODE_TARGET" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build > xcodebuild.log 2>&1
          CODE=$?
          echo "=== xcodebuild exit code: $CODE ==="
          echo "=== lines mentioning error/failed ==="
          grep -iE "error:|failed" xcodebuild.log | head -25 || true
          echo "=== last 30 log lines ==="
          tail -30 xcodebuild.log
          exit $CODE
      # NOTE: -target is used (not -scheme) because the project ships no
      # shared .xcschemes. -derivedDataPath is intentionally omitted:
      # xcodebuild requires -scheme when -derivedDataPath is specified.
      - name: Package unsigned .ipa
        script: |
          set -e
          cd app
          APP_PATH="$(find ~/Library/Developer/Xcode/DerivedData -maxdepth 5 -type d -name "App.app" -path "*Release-iphoneos*" 2>/dev/null | head -1)"
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "ERROR: built App.app not found under Xcode DerivedData" >&2
            exit 1
          fi
          echo "Found: $APP_PATH"
          rm -rf Payload PaintScope-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry PaintScope-unsigned.ipa Payload
          ls -lh PaintScope-unsigned.ipa
    artifacts:
      - app/PaintScope-unsigned.ipa
      - app/xcodebuild.log
